env:
  - name: RUNTIME_DISCOVERY_ENABLED
    valueFrom:
      configMapKeyRef:
        name: discovery-settings
        key: enabled
config:
  oidc:
    secret:
      create: false
    clientID: headlamp
    issuerURL: https://idp.example.com
  extraArgs:
    - --enable-cluster-api=$(RUNTIME_DISCOVERY_ENABLED)
    - --enable-cluster-api=false
    - --enable-cluster-api=true
    - --oidc-idp-issuer-url=
