env:
  - name: DISCOVERY_ENABLED
    valueFrom:
      configMapKeyRef:
        name: discovery-settings
        key: enabled
config:
  oidc:
    secret:
      create: false
    clientID: headlamp
    issuerURL: https://idp.example.com
  clusterInventory:
    enabled: true
  clusterAPI:
    enabled: true
  extraArgs:
    - --enable-cluster-inventory=$(DISCOVERY_ENABLED)
    - --enable-cluster-api=$(DISCOVERY_ENABLED)
    - --oidc-idp-issuer-url=
