env:
  - name: CLIENT_ID_FILE
    valueFrom:
      configMapKeyRef:
        name: oidc-settings
        key: client-id-file
  - name: CLIENT_SECRET_FILE
    valueFrom:
      configMapKeyRef:
        name: oidc-settings
        key: client-secret-file
  - name: ISSUER
    value: https://idp.example.com
config:
  oidc:
    secret:
      create: false
  clusterInventory:
    enabled: true
  extraArgs:
    - --oidc-client-id-file=$(CLIENT_ID_FILE)
    - --oidc-client-secret-file=$(CLIENT_SECRET_FILE)
    - --oidc-idp-issuer-url=$(ISSUER)
