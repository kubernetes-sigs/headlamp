# This is a test case for disabling token login with an external OIDC secret.
# disableTokenLogin is a policy, not a secret, so it must still be passed as an
# argument when the OIDC configuration comes from an external secret.
config:
  oidc:
    secret:
      create: false
    externalSecret:
      enabled: true
      name: oidc
    disableTokenLogin: true
