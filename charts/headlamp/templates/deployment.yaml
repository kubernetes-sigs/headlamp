{{- $oidc := .Values.config.oidc }}
{{- $env := .Values.env }}

{{- /* Disable the bundled static plugins (e.g. Prometheus) by clearing
       HEADLAMP_STATIC_PLUGINS_DIR. `hasKey` guards against false being treated
       as empty by `default`, and an unset value defaults to serving them. */}}
{{- $staticPlugins := .Values.config.staticPlugins | default dict }}
{{- $staticPluginsDisabled := and (hasKey $staticPlugins "enabled") (not $staticPlugins.enabled) }}

{{- $clientID := "" }}
{{- $clientSecret := "" }}
{{- $issuerURL := "" }}
{{- $scopes := "" }}
{{- $callbackURL := "" }}
{{- $validatorClientID := "" }}
{{- $validatorIssuerURL := "" }}
{{- $usePKCE := "" }}
{{- $useAccessToken := "" }}
{{- $meUserInfoURL := "" }}
{{- /* The backend also reads these env names directly. They only feed the
       discovery OIDC check, so no -oidc-* flag is rendered for them. */}}
{{- $backendEnvClientID := "" }}
{{- $backendEnvIssuerURL := "" }}
{{- $oidcClientFileConfigured := false }}
{{- $environment := dict }}
{{- $discoveryFlags := dict "enable-cluster-inventory" (dict "known" true "value" "false") "enable-cluster-api" (dict "known" true "value" "false") }}
{{- $clusterInventory := .Values.config.clusterInventory | default dict }}
{{- $clusterInventoryEnabled := $clusterInventory.enabled | default false }}
{{- $clusterAPI := .Values.config.clusterAPI | default dict }}
{{- $clusterAPIEnabled := $clusterAPI.enabled | default false }}
{{- range $key := list "accessProvidersConfig" "plugins" }}
{{- if not (empty (get $clusterInventory $key)) }}
{{-   fail (printf "config.clusterInventory.%s is no longer supported; Cluster Inventory requires per-user OIDC" $key) }}
{{- end }}
{{- end }}
{{- $readOnlyRootFs := eq (include "headlamp.readOnlyRootFilesystem" .Values) "true" }}
{{- $pluginManagerSecurityContext := dict }}
{{- if .Values.pluginsManager.securityContext }}
{{- $pluginManagerSecurityContext = .Values.pluginsManager.securityContext }}
{{- else if .Values.securityContext }}
{{- $pluginManagerSecurityContext = .Values.securityContext }}
{{- end }}
{{- $readOnlyRootFsPlugins := and .Values.pluginsManager.enabled (eq (include "headlamp.readOnlyRootFilesystem" (dict "securityContext" $pluginManagerSecurityContext)) "true") }}
{{- $tmpCtx := include "headlamp.tmpVolumeContext" (dict "volumeMounts" .Values.volumeMounts "volumes" .Values.volumes "readOnly" $readOnlyRootFs "mountName" "headlamp-tmp") | fromYaml }}
{{- $pluginsTmpCtx := include "headlamp.tmpVolumeContext" (dict "volumeMounts" .Values.pluginsManager.volumeMounts "volumes" .Values.volumes "readOnly" $readOnlyRootFsPlugins "mountName" "headlamp-plugins-tmp") | fromYaml }}
{{- $oidcAutoLogin := "" }}

# This block of code is used to extract the values from the env.
# This is done to check if the values are non-empty and if they are, they are used in the deployment.yaml.
{{- range $env }}
  {{- $value := "" }}
  {{- if hasKey . "value" }}
    {{- $value = .value | toString }}
  {{- end }}
  {{- $entry := include "headlamp.literalEnvValue" (dict "state" (dict "known" (hasKey . "value") "value" $value) "environment" $environment) | fromJson }}
  {{- $_ := set $environment .name $entry }}
  {{- if or (not $entry.known) (ne $entry.value "") }}
    {{- if eq .name "HEADLAMP_CONFIG_ENABLE_CLUSTER_INVENTORY" }}
      {{- $_ := set $discoveryFlags "enable-cluster-inventory" $entry }}
    {{- end }}
    {{- if eq .name "HEADLAMP_CONFIG_ENABLE_CLUSTER_API" }}
      {{- $_ := set $discoveryFlags "enable-cluster-api" $entry }}
    {{- end }}
  {{- end }}
  {{- if eq .name "OIDC_CLIENT_ID" }}
    {{- $clientID = .value }}
  {{- end }}
  {{- if eq .name "HEADLAMP_CONFIG_OIDC_CLIENT_ID" }}
    {{- $backendEnvClientID = .value }}
  {{- end }}
  {{- if eq .name "HEADLAMP_CONFIG_OIDC_CLIENT_ID_FILE" }}
    {{- $oidcClientFileConfigured = or (not (empty .value)) (not (empty .valueFrom)) }}
  {{- end }}
  {{- if eq .name "HEADLAMP_CONFIG_OIDC_IDP_ISSUER_URL" }}
    {{- $backendEnvIssuerURL = .value }}
  {{- end }}
  {{- if eq .name "OIDC_CLIENT_SECRET" }}
    {{- $clientSecret = .value }}
  {{- end }}
  {{- if eq .name "OIDC_ISSUER_URL" }}
    {{- $issuerURL = .value }}
  {{- end }}
  {{- if eq .name "OIDC_SCOPES" }}
    {{- $scopes = .value }}
  {{- end }}
  {{- if eq .name "OIDC_CALLBACK_URL" }}
    {{- $callbackURL = .value }}
  {{- end }}
  {{- if eq .name "OIDC_VALIDATOR_CLIENT_ID" }}
    {{- $validatorClientID = .value }}
  {{- end }}
  {{- if eq .name "OIDC_VALIDATOR_ISSUER_URL" }}
    {{- $validatorIssuerURL = .value }}
  {{- end }}
  {{- if eq .name "OIDC_USE_ACCESS_TOKEN" }}
    {{- $useAccessToken = .value | toString }}
  {{- end }}
  {{- if eq .name "OIDC_USE_PKCE" }}
    {{- $usePKCE = .value | toString }}
  {{- end }}
  {{- if eq .name "ME_USER_INFO_URL" }}
    {{- $meUserInfoURL = .value | toString }}
  {{- end }}
  {{- if eq .name "OIDC_AUTO_LOGIN" }}
    {{- $oidcAutoLogin = .value | toString }}
  {{- end }}
{{- end }}

{{- $extraArgs := .Values.config.extraArgs }}
{{- $argumentStates := list }}
{{- range $extraArgs }}
  {{- $state := include "headlamp.literalEnvValue" (dict "state" (dict "known" true "value" .) "environment" $environment) | fromJson }}
  {{- $argumentStates = append $argumentStates $state }}
{{- end }}
{{- if $clusterInventoryEnabled }}
  {{- $_ := set $discoveryFlags "enable-cluster-inventory" (dict "known" true "value" "true") }}
{{- end }}
{{- if $clusterAPIEnabled }}
  {{- $_ := set $discoveryFlags "enable-cluster-api" (dict "known" true "value" "true") }}
{{- end }}
{{- $oidcArgs := dict }}
{{- /* Keep boolean flag names in sync with backend/pkg/config. Other bare
       flags consume the next argument, even when that value looks like a flag. */}}
{{- $booleanFlags := list
    "version" "in-cluster" "dev" "cache-enabled" "no-browser" "insecure-ssl"
    "enable-dynamic-clusters" "allow-kubeconfig-changes" "watch-plugins-changes"
    "enable-helm" "unsafe-use-service-account-token" "oidc-auto-login"
    "oidc-skip-tls-verify" "oidc-skip-logout" "oidc-api-proxy-skip-tls-verify"
    "oidc-use-access-token" "oidc-use-cookie" "oidc-use-token-broadcast"
    "oidc-use-pkce" "proxy-auth" "tracing-enabled" "metrics-enabled"
    "use-otlp-http" "stdout-trace-enabled" "enable-cluster-inventory" "enable-cluster-api" }}
{{- $skipNext := false }}
{{- $parseArgs := true }}
{{- $argumentScanKnown := true }}
{{- range $index, $argument := $argumentStates }}
  {{- $arg := $argument.value }}
  {{- if $parseArgs }}
    {{- if $skipNext }}
      {{- $skipNext = false }}
    {{- else if and (not $argument.known) (or (not (hasPrefix "-" $arg)) (contains "$(" (first (splitList "=" $arg)))) }}
      {{- $argumentScanKnown = false }}
      {{- $parseArgs = false }}
    {{- else if or (eq $arg "--") (eq $arg "-") (not (hasPrefix "-" $arg)) }}
      {{- $parseArgs = false }}
    {{- else }}
      {{- $flagName := first (splitList "=" (trimPrefix "-" (trimPrefix "-" $arg))) }}
      {{- if regexMatch "^--?oidc-(client-(id|secret)(-file)?|idp-issuer-url)(=|$)" $arg }}
        {{- $flag := regexFind "^--?oidc-(client-(id|secret)(-file)?|idp-issuer-url)" $arg }}
        {{- $value := "" }}
        {{- $hasValue := false }}
        {{- $flagLikeValue := false }}
        {{- $known := $argument.known }}
        {{- if contains "=" $arg }}
          {{- $value = trimPrefix (printf "%s=" $flag) $arg }}
          {{- $hasValue = true }}
        {{- else if lt (add1 $index) (len $argumentStates) }}
          {{- $next := index $argumentStates (add1 $index) }}
          {{- $value = $next.value }}
          {{- $known = $next.known }}
          {{- $hasValue = true }}
          {{- $flagLikeValue = hasPrefix "-" $value }}
        {{- end }}
        {{- $_ := set $oidcArgs $flagName (dict "value" $value "known" $known "hasValue" $hasValue "flagLikeValue" $flagLikeValue) }}
      {{- end }}
      {{- if has $flagName (list "enable-cluster-inventory" "enable-cluster-api") }}
        {{- $value := "true" }}
        {{- if contains "=" $arg }}
          {{- $value = trimPrefix (printf "%s=" (first (splitList "=" $arg))) $arg }}
        {{- end }}
        {{- $state := include "headlamp.discoveryFlagState" (dict "state" (dict "known" $argument.known "value" $value "expanded" true) "environment" $environment) | fromJson }}
        {{- if and $state.known (not $state.valid) }}
          {{- fail (printf "%s has an invalid boolean value in config.extraArgs" $flagName) }}
        {{- end }}
        {{- $_ := set $discoveryFlags $flagName $state }}
      {{- end }}
      {{- $skipNext = and (not (contains "=" $arg)) (not (has $flagName $booleanFlags)) }}
    {{- end }}
  {{- end }}
{{- end }}

{{- range $name, $option := $discoveryFlags }}
  {{- $state := include "headlamp.discoveryFlagState" (dict "state" $option "environment" $environment) | fromJson }}
  {{- /* k.Bool treats invalid environment strings as false. Explicit CLI
         argument values were validated during the scan above. */}}
  {{- $_ := set $discoveryFlags $name $state }}
{{- end }}
{{- $inventoryState := get $discoveryFlags "enable-cluster-inventory" }}
{{- $apiState := get $discoveryFlags "enable-cluster-api" }}
{{- $discoveryEnabled := and $argumentScanKnown (or (and $inventoryState.known $inventoryState.enabled) (and $apiState.known $apiState.enabled)) }}
{{- if $discoveryEnabled }}
  {{- $directClientID := or $oidc.externalSecret.enabled (ne $oidc.clientID "") (ne $clientID "") (hasKey $oidcArgs "oidc-client-id") }}
  {{- $directClientSecret := or $oidc.externalSecret.enabled (ne $oidc.clientSecret "") (ne $clientSecret "") (hasKey $oidcArgs "oidc-client-secret") }}
  {{- range $name, $option := $oidcArgs }}
    {{- if not $option.hasValue }}
      {{- fail (printf "%s requires a value in config.extraArgs" $name) }}
    {{- end }}
    {{- $used := or (eq $name "oidc-idp-issuer-url") (and (eq $name "oidc-client-id-file") (not $directClientID)) (and (eq $name "oidc-client-secret-file") (not $directClientSecret)) }}
    {{- if and $used $option.known (or (empty $option.value) $option.flagLikeValue (and (eq $name "oidc-idp-issuer-url") (empty (trim $option.value)))) }}
      {{- fail (printf "%s requires a non-empty value in config.extraArgs" $name) }}
    {{- end }}
  {{- end }}
{{- end }}

{{- if hasKey $oidcArgs "oidc-client-id-file" }}
  {{- $option := get $oidcArgs "oidc-client-id-file" }}
  {{- $oidcClientFileConfigured = not (empty $option.value) }}
{{- end }}
{{- $oidcClientKnown := true }}
{{- $oidcClientConfigured := or $oidc.externalSecret.enabled (ne $oidc.clientID "") (ne $clientID "") (ne $backendEnvClientID "") $oidcClientFileConfigured }}
{{- if hasKey $oidcArgs "oidc-client-id" }}
  {{- $option := get $oidcArgs "oidc-client-id" }}
  {{- $oidcClientKnown = $option.known }}
  {{- $oidcClientConfigured = not (empty (trim $option.value)) }}
{{- else if and (hasKey $oidcArgs "oidc-client-id-file") (not (or $oidc.externalSecret.enabled (ne $oidc.clientID "") (ne $clientID ""))) }}
  {{- $option := get $oidcArgs "oidc-client-id-file" }}
  {{- $oidcClientKnown = $option.known }}
{{- end }}
{{- $oidcIssuerKnown := true }}
{{- $oidcIssuerConfigured := or $oidc.externalSecret.enabled (ne $oidc.issuerURL "") (ne $issuerURL "") (ne $backendEnvIssuerURL "") }}
{{- if hasKey $oidcArgs "oidc-idp-issuer-url" }}
  {{- $option := get $oidcArgs "oidc-idp-issuer-url" }}
  {{- $oidcIssuerKnown = $option.known }}
  {{- $oidcIssuerConfigured = not (empty (trim $option.value)) }}
{{- end }}
{{- if and $discoveryEnabled (or (and $oidcClientKnown (not $oidcClientConfigured)) (and $oidcIssuerKnown (not $oidcIssuerConfigured))) }}
{{-   fail "Cluster discovery requires the OIDC client ID and issuer URL; set config.oidc (or OIDC / HEADLAMP_CONFIG_OIDC env vars / externalSecret)" }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "headlamp.fullname" . }}
  namespace: {{ include "headlamp.namespace" . }}
  labels:
    {{- include "headlamp.labels" . | nindent 4 }}
    {{- with .Values.deploymentLabels }}
      {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "headlamp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "headlamp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "headlamp.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      hostUsers: {{ .Values.hostUsers }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- if .Values.securityContext }}
              {{- toYaml .Values.securityContext | nindent 12 }}
            {{- else }}
              {{- $defaultSC := dict "allowPrivilegeEscalation" false "runAsNonRoot" true "seccompProfile" (dict "type" "RuntimeDefault") "capabilities" (dict "drop" (list "ALL")) }}
              {{- toYaml $defaultSC | nindent 12 }}
            {{- end }}
          image: "{{ .Values.image.registry}}/{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{ if or $oidc .Values.env $staticPluginsDisabled }}
          {{- if $oidc.externalSecret.enabled }}
          # Check if externalSecret is enabled
          envFrom:
          - secretRef:
              name: {{ $oidc.externalSecret.name }}
          {{- if or .Values.env $staticPluginsDisabled }}
          env:
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $staticPluginsDisabled }}
            - name: HEADLAMP_STATIC_PLUGINS_DIR
              value: ""
            {{- end }}
          {{- end }}
          {{- else }}
          env:
            {{- if $oidc.secret.create }}
            {{- if $oidc.clientID }}
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc.secret.name }}
                  key: clientID
            {{- end }}
            {{- if $oidc.clientSecret }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc.secret.name }}
                  key: clientSecret
            {{- end }}
            {{- if $oidc.issuerURL }}
            - name: OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc.secret.name }}
                  key: issuerURL
            {{- end }}
            {{- if $oidc.scopes }}
            - name: OIDC_SCOPES
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc.secret.name }}
                  key: scopes
            {{- end }}
            {{- if $oidc.callbackURL }}
            - name: OIDC_CALLBACK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc.secret.name }}
                  key: callbackURL
            {{- end }}
            {{- if $oidc.validatorClientID }}
            - name: OIDC_VALIDATOR_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc.secret.name }}
                  key: validatorClientID
            {{- end }}
            {{- if $oidc.validatorIssuerURL }}
            - name: OIDC_VALIDATOR_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc.secret.name }}
                  key: validatorIssuerURL
            {{- end }}
            {{- if $oidc.useAccessToken }}
            - name: OIDC_USE_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc.secret.name }}
                  key: useAccessToken
            {{- end }}
            {{- if $oidc.usePKCE }}
            - name: OIDC_USE_PKCE
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc.secret.name }}
                  key: usePKCE
            {{- end }}
            {{- if $oidc.meUserInfoURL }}
            - name: ME_USER_INFO_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc.secret.name }}
                  key: meUserInfoURL
            {{- end }}
            {{- if $oidc.autoLogin }}
            - name: OIDC_AUTO_LOGIN
              value: {{ $oidc.autoLogin | quote }}
            {{- end }}
            {{- else }}
            {{- if $oidc.clientID }}
            - name: OIDC_CLIENT_ID
              value: {{ $oidc.clientID | quote }}
            {{- end }}
            {{- if $oidc.clientSecret }}
            - name: OIDC_CLIENT_SECRET
              value: {{ $oidc.clientSecret | quote }}
            {{- end }}
            {{- if $oidc.issuerURL }}
            - name: OIDC_ISSUER_URL
              value: {{ $oidc.issuerURL | quote }}
            {{- end }}
            {{- if $oidc.scopes }}
            - name: OIDC_SCOPES
              value: {{ $oidc.scopes | quote }}
            {{- end }}
            {{- if $oidc.callbackURL }}
            - name: OIDC_CALLBACK_URL
              value: {{ $oidc.callbackURL | quote }}
            {{- end }}
            {{- if $oidc.validatorClientID }}
            - name: OIDC_VALIDATOR_CLIENT_ID
              value: {{ $oidc.validatorClientID | quote }}
            {{- end }}
            {{- if $oidc.validatorIssuerURL }}
            - name: OIDC_VALIDATOR_ISSUER_URL
              value: {{ $oidc.validatorIssuerURL | quote }}
            {{- end }}
            {{- if $oidc.useAccessToken }}
            - name: OIDC_USE_ACCESS_TOKEN
              value: {{ $oidc.useAccessToken | quote }}
            {{- end }}
            {{- if $oidc.usePKCE }}
            - name: OIDC_USE_PKCE
              value: {{ $oidc.usePKCE | quote }}
            {{- end }}
            {{- if $oidc.meUserInfoURL }}
            - name: ME_USER_INFO_URL
              value: {{ $oidc.meUserInfoURL | quote }}
            {{- end }}
            {{- if $oidc.autoLogin }}
            - name: OIDC_AUTO_LOGIN
              value: {{ $oidc.autoLogin | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.env }}
            {{- toYaml .Values.env | nindent 12 }}
            {{- end }}
            {{- if $staticPluginsDisabled }}
            - name: HEADLAMP_STATIC_PLUGINS_DIR
              value: ""
            {{- end }}
          {{- end }}
          {{- end }}
          args:
            {{- if .Values.config.inCluster }}
            - "-in-cluster"
            {{- if .Values.config.inClusterContextName }}
            - "-in-cluster-context-name={{ .Values.config.inClusterContextName }}"
            {{- end }}
            {{- end }}
            {{- with .Values.config.enableHelm }}
            - "-enable-helm"
            {{- end }}
            {{- if .Values.config.watchPlugins }}
            - "-watch-plugins-changes"
            {{- end }}
            {{- if .Values.config.oidc.useCookie }}  
            - "-oidc-use-cookie"                     
            {{- end }}
            {{- with .Values.config.pluginsDir}}
            - "-plugins-dir={{ . }}"
            {{- end }}
            {{- if hasKey .Values.config "sessionTTL" }}
            - "-session-ttl={{ int .Values.config.sessionTTL }}"
            {{- end }}
            {{- with .Values.config.podDebugImage }}
            - "-pod-debug-image={{ . }}"
            {{- end }}
            {{- with .Values.config.nodeShellImage }}
            - "-node-shell-image={{ . }}"
            {{- end }}
            {{- with .Values.config.nodeShellNamespace }}
            - "-node-shell-namespace={{ . }}"
            {{- end }}
            {{- if and .Values.config.inCluster .Values.config.unsafeUseServiceAccountToken }}
            - "-unsafe-use-service-account-token"
            {{- end }}
            {{- if and .Values.config.inCluster .Values.config.unsafeUseServiceAccountToken .Values.config.serviceAccountTokenPath }}
            - "-service-account-token-path={{ .Values.config.serviceAccountTokenPath }}"
            {{- end }}
            {{- if $clusterAPIEnabled }}
            - "-enable-cluster-api"
            {{- with $clusterAPI.labelSelector }}
            - "-cluster-api-label-selector={{ . }}"
            {{- end }}
            {{- with $clusterAPI.namespaces }}
            - "-cluster-api-namespaces={{ join "," . }}"
            {{- end }}
            {{- end }}
            {{- if $clusterInventoryEnabled }}
            - "-enable-cluster-inventory"
            {{- with $clusterInventory.labelSelector }}
            - "-cluster-inventory-label-selector={{ . }}"
            {{- end }}
            {{- with $clusterInventory.namespaces }}
            - "-cluster-inventory-namespaces={{ join "," . }}"
            {{- end }}
            {{- with $clusterInventory.rootReconcileInterval }}
            - "-cluster-inventory-root-reconcile-interval={{ . }}"
            {{- end }}
            {{- with $clusterInventory.noCRDCacheTTL }}
            - "-cluster-inventory-no-crd-cache-ttl={{ . }}"
            {{- end }}
            {{- end }}
            {{- if not $oidc.externalSecret.enabled}}
            # Check if externalSecret is disabled
            {{- if or (ne $oidc.clientID "") (ne $clientID "") }}
            # Check if clientID is non empty either from env or oidc.config
            - "-oidc-client-id=$(OIDC_CLIENT_ID)"
            {{- end }}
            {{- if or (ne $oidc.clientSecret "") (ne $clientSecret "") }}
            # Check if clientSecret is non empty either from env or oidc.config
            - "-oidc-client-secret=$(OIDC_CLIENT_SECRET)"
            {{- end }}
            {{- if or (ne $oidc.issuerURL "") (ne $issuerURL "") }}
            # Check if issuerURL is non empty either from env or oidc.config
            - "-oidc-idp-issuer-url=$(OIDC_ISSUER_URL)"
            {{- end }}
            {{- if or (ne $oidc.scopes "") (ne $scopes "") }}
            # Check if scopes are non empty either from env or oidc.config
            - "-oidc-scopes=$(OIDC_SCOPES)"
            {{- end }}
            {{- if or (ne $oidc.callbackURL "") (ne $callbackURL "") }}
            # Check if callbackURL is non empty either from env or oidc.config
            - "-oidc-callback-url=$(OIDC_CALLBACK_URL)"
            {{- end }}
            {{- if or (ne $oidc.validatorClientID "") (ne $validatorClientID "") }}
            # Check if validatorClientID is non empty either from env or oidc.config
            - "-oidc-validator-client-id=$(OIDC_VALIDATOR_CLIENT_ID)"
            {{- end }}
            {{- if or (ne $oidc.validatorIssuerURL "") (ne $validatorIssuerURL "") }}
            # Check if validatorIssuerURL is non empty either from env or oidc.config
            - "-oidc-validator-idp-issuer-url=$(OIDC_VALIDATOR_ISSUER_URL)"
            {{- end }}
            {{- if or (ne ($oidc.useAccessToken | toString) "false") (ne $useAccessToken "") }}
            # Check if useAccessToken is non false either from env or oidc.config
            - "-oidc-use-access-token=$(OIDC_USE_ACCESS_TOKEN)"
            {{- end }}
            {{- if or (eq ($oidc.usePKCE | toString) "true") (eq $usePKCE "true") }}
            - "-oidc-use-pkce=$(OIDC_USE_PKCE)"
            {{- end }}
            {{- if or (ne $oidc.meUserInfoURL "") (ne $meUserInfoURL "") }}
            - "-me-user-info-url=$(ME_USER_INFO_URL)"
            {{- end }}
            {{- if or (eq ($oidc.autoLogin | toString) "true") (eq $oidcAutoLogin "true") }}
            - "-oidc-auto-login=$(OIDC_AUTO_LOGIN)"
            {{- end }}
            {{- else }}
            - "-oidc-client-id=$(OIDC_CLIENT_ID)"
            - "-oidc-client-secret=$(OIDC_CLIENT_SECRET)"
            - "-oidc-idp-issuer-url=$(OIDC_ISSUER_URL)"
            {{- if $oidc.externalSecret.hasScopes }}
            - "-oidc-scopes=$(OIDC_SCOPES)"
            {{- end }}
            {{- if or (ne $oidc.callbackURL "") (ne $callbackURL "") }}
            # Check if callbackURL is non empty either from env or oidc.config
            - "-oidc-callback-url=$(OIDC_CALLBACK_URL)"
            {{- end }}
            {{- if or (eq ($oidc.usePKCE | toString) "true") (eq $usePKCE "true") }}
            - "-oidc-use-pkce=$(OIDC_USE_PKCE)"
            {{- end }}
            {{- if or (ne $oidc.validatorClientID "") (ne $validatorClientID "") }}
            # Check if validatorClientID is non empty either from env or oidc.config
            - "-oidc-validator-client-id=$(OIDC_VALIDATOR_CLIENT_ID)"
            {{- end }}
            {{- if or (ne $oidc.validatorIssuerURL "") (ne $validatorIssuerURL "") }}
            # Check if validatorIssuerURL is non empty either from env or oidc.config
            - "-oidc-validator-idp-issuer-url=$(OIDC_VALIDATOR_ISSUER_URL)"
            {{- end }}
            {{- if or (eq ($oidc.useAccessToken | toString) "true") (eq $useAccessToken "true") }}
            # Check if useAccessToken is non false either from env or oidc.config
            - "-oidc-use-access-token=$(OIDC_USE_ACCESS_TOKEN)"
            {{- end }}
            {{- if or (ne $oidc.meUserInfoURL "") (ne $meUserInfoURL "") }}
            - "-me-user-info-url=$(ME_USER_INFO_URL)"
            {{- end }}
            {{- if or (eq ($oidc.autoLogin | toString) "true") (eq $oidcAutoLogin "true") }}
            {{- if eq ($oidc.autoLogin | toString) "true" }}
            - "-oidc-auto-login=true"
            {{- else if eq $oidcAutoLogin "true" }}
            - "-oidc-auto-login=$(OIDC_AUTO_LOGIN)"
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if eq ($oidc.useTokenBroadcast | toString) "true" }}
            - "-oidc-use-token-broadcast=true"
            {{- end }}
            {{- with .Values.config.baseURL }}
            - "-base-url={{ . }}"
            {{- end }}
            {{- with .Values.config.tlsCertPath }}
            - "-tls-cert-path={{ . }}"
            {{- end }}
            {{- with .Values.config.tlsKeyPath }}
            - "-tls-key-path={{ . }}"
            {{- end }}
            {{- with .Values.config.extraArgs }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 4466
              protocol: TCP
          livenessProbe:
            {{- if .Values.probes.livenessProbe.custom }}
            {{- toYaml .Values.probes.livenessProbe.custom | nindent 12 }}
            {{- else }}
            httpGet:
              path: "{{ .Values.config.baseURL }}/"
              port: http
              scheme: {{ .Values.probes.scheme | default "HTTP" }}
            initialDelaySeconds: {{ .Values.probes.livenessProbe.initialDelaySeconds | default 0 }}
            periodSeconds: {{ .Values.probes.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.probes.livenessProbe.timeoutSeconds | default 1 }}
            successThreshold: 1
            failureThreshold: {{ .Values.probes.livenessProbe.failureThreshold | default 3 }}
            {{- end }}
          readinessProbe:
            {{- if .Values.probes.readinessProbe.custom }}
            {{- toYaml .Values.probes.readinessProbe.custom | nindent 12 }}
            {{- else }}
            httpGet:
              path: "{{ .Values.config.baseURL }}/"
              port: http
              scheme: {{ .Values.probes.scheme | default "HTTP" }}
            initialDelaySeconds: {{ .Values.probes.readinessProbe.initialDelaySeconds | default 0 }}
            periodSeconds: {{ .Values.probes.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.probes.readinessProbe.timeoutSeconds | default 1 }}
            successThreshold: {{ .Values.probes.readinessProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.probes.readinessProbe.failureThreshold | default 3 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.pluginsManager.enabled .Values.volumeMounts $tmpCtx.addMount }}
          volumeMounts:
            {{- if .Values.pluginsManager.enabled }}
            - name: plugins-dir
              mountPath: {{ .Values.config.pluginsDir }}
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $tmpCtx.addMount }}
            - name: headlamp-tmp
              mountPath: /tmp
            {{- end }}
          {{- end }}
        {{- if .Values.pluginsManager.enabled }}
        - name: headlamp-plugin
          image: {{ .Values.pluginsManager.baseImage }}
          command: ["/bin/sh", "-c"]
          {{- if .Values.pluginsManager.env }}
          env:
            {{- toYaml .Values.pluginsManager.env | nindent 12 }}
          {{- end }}
          args:
            - |
              if [ -f "/config/plugin.yml" ]; then
                echo "Installing plugins from config..."
                cat /config/plugin.yml
                # Use a writable cache directory
                export NPM_CONFIG_CACHE=/tmp/npm-cache
                # Use a writable config directory
                export NPM_CONFIG_USERCONFIG=/tmp/npm-userconfig
                mkdir -p /tmp/npm-cache /tmp/npm-userconfig
                npx --yes @headlamp-k8s/pluginctl@{{ .Values.pluginsManager.version }} install --config /config/plugin.yml --folderName {{ .Values.config.pluginsDir }} --watch
              fi
          volumeMounts:
            - name: plugins-dir
              mountPath: {{ .Values.config.pluginsDir }}
            - name: plugin-config
              mountPath: /config
            {{- if $pluginsTmpCtx.addMount }}
            - name: headlamp-plugins-tmp
              mountPath: /tmp
            {{- end }}
            {{- with .Values.pluginsManager.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.pluginsManager.resources | nindent 12 }}
          securityContext:
            {{- if .Values.pluginsManager.securityContext }}
              {{- toYaml .Values.pluginsManager.securityContext | nindent 12 }}
            {{- else if $.Values.securityContext }}
              {{- toYaml $.Values.securityContext | nindent 12 }}
            {{- else }}
              {{- $defaultSC := dict "allowPrivilegeEscalation" false "runAsNonRoot" true "seccompProfile" (dict "type" "RuntimeDefault") "capabilities" (dict "drop" (list "ALL")) }}
              {{- toYaml $defaultSC | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range $constraint := . }}
        - {{ toYaml $constraint | nindent 10 }}
          {{- if not $constraint.labelSelector }}
          labelSelector:
            matchLabels:
              {{- include "headlamp.selectorLabels" $ | nindent 14 }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- if or .Values.pluginsManager.enabled .Values.volumes $tmpCtx.addVolume $pluginsTmpCtx.addVolume }}
      volumes:
        {{- if .Values.pluginsManager.enabled }}
        - name: plugins-dir
          emptyDir: {}
        - name: plugin-config
          configMap:
            name: {{ include "headlamp.fullname" . }}-plugin-config
        {{- if $pluginsTmpCtx.addVolume }}
        - name: headlamp-plugins-tmp
          emptyDir: {}
        {{- end }}
        {{- end }}
        {{- if $tmpCtx.addVolume }}
        - name: headlamp-tmp
          emptyDir: {}
        {{- end }}
        {{- with .Values.volumes}}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
