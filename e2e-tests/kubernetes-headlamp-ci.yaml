# Source: headlamp/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: headlamp
  namespace: kube-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Source: headlamp/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: kube-system
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 4466
  selector:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-kubeconfig
  namespace: kube-system
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
    - name: kind-test
      cluster:
        server: ${TEST_SERVER}
        certificate-authority-data: ${TEST_CA_DATA}
    - name: kind-test2
      cluster:
        server: ${TEST2_SERVER}
        certificate-authority-data: ${TEST2_CA_DATA}
    contexts:
    - name: test
      context:
        cluster: kind-test
        user: headlamp-admin-test
    - name: test2
      context:
        cluster: kind-test2
        user: headlamp-admin-test2
    users:
    - name: headlamp-admin-test
      user:
    - name: headlamp-admin-test2
      user:
    current-context: test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-cluster-inventory
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headlamp-cluster-inventory
  namespace: kube-system
rules:
- apiGroups:
  - multicluster.x-k8s.io
  resources:
  - clusterprofiles
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headlamp-cluster-inventory
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headlamp-cluster-inventory
subjects:
- kind: ServiceAccount
  name: headlamp-cluster-inventory
  namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-cluster-inventory-provider
  namespace: kube-system
data:
  config.json: |
    {
      "providers": [
        {
          "name": "headlamp-e2e-token",
          "execConfig": {
            "apiVersion": "client.authentication.k8s.io/v1",
            "command": "/etc/cluster-inventory/credential-plugin.sh",
            "provideClusterInfo": true,
            "interactiveMode": "Never"
          }
        }
      ]
    }
  credential-plugin.sh: |
    #!/bin/sh
    set -eu

    token="$(cat /var/run/secrets/cluster-inventory-spoke/token)"
    printf '{"apiVersion":"client.authentication.k8s.io/v1","kind":"ExecCredential","status":{"token":"%s"}}\n' "$token"
---
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-cluster-inventory-spoke
  namespace: kube-system
type: Opaque
stringData:
  token: "${INVENTORY_SPOKE_TOKEN}"
---
apiVersion: multicluster.x-k8s.io/v1alpha1
kind: ClusterProfile
metadata:
  name: inventory-test2
  namespace: kube-system
spec:
  displayName: inventory-test2
  clusterManager:
    name: headlamp-e2e
---
# Source: headlamp/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: kube-system
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
      app.kubernetes.io/instance: headlamp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp
        app.kubernetes.io/instance: headlamp
    spec:
      serviceAccountName: headlamp-cluster-inventory
      initContainers:
      - command:
        - /bin/sh
        - -c
        - mkdir -p /build/plugins && cp -r /plugins/* /build/plugins/
        image: ghcr.io/headlamp-k8s/headlamp-plugins-test:latest
        imagePullPolicy: Never
        name: headlamp-plugins
        volumeMounts:
        - mountPath: /build/plugins
          name: headlamp-plugins
      containers:
      - name: headlamp
        securityContext:
          privileged: false
          runAsGroup: 101
          runAsNonRoot: true
          runAsUser: 100
        image: "ghcr.io/headlamp-k8s/headlamp:latest"
        imagePullPolicy: Never
        args:
        - "-enable-dynamic-clusters"
        - "-in-cluster"
        - "-in-cluster-context-name=main"
        - "-enable-cluster-inventory"
        - "-cluster-inventory-provider-file=/etc/cluster-inventory/config.json"
        - "-cluster-inventory-label-selector=!headlamp.dev/ignore"
        - "-cluster-inventory-root-reconcile-interval=2s"
        - "-cluster-inventory-no-crd-cache-ttl=2s"
        - "-plugins-dir=/build/plugins"
        env:
        - name: KUBECONFIG
          value: "/home/headlamp/.config/Headlamp/kubeconfigs/config"
        ports:
        - name: http
          containerPort: 4466
          protocol: TCP
        volumeMounts:
        - mountPath: /build/plugins
          name: headlamp-plugins
        - mountPath: "/home/headlamp/.config/Headlamp/kubeconfigs"
          name: kubeconfig
        - mountPath: /etc/cluster-inventory
          name: cluster-inventory-provider
          readOnly: true
        - mountPath: /var/run/secrets/cluster-inventory-spoke
          name: cluster-inventory-spoke
          readOnly: true
      nodeSelector:
        'kubernetes.io/os': linux
      volumes:
      - name: headlamp-plugins
        persistentVolumeClaim:
          claimName: headlamp
      - name: kubeconfig
        configMap:
          name: headlamp-kubeconfig
          items:
          - key: config
            path: config
      - name: cluster-inventory-provider
        configMap:
          name: headlamp-cluster-inventory-provider
          items:
          - key: config.json
            path: config.json
            mode: 0444
          - key: credential-plugin.sh
            path: credential-plugin.sh
            mode: 0555
      - name: cluster-inventory-spoke
        secret:
          secretName: headlamp-cluster-inventory-spoke
          items:
          - key: token
            path: token
            mode: 0444
---
kind: Secret
apiVersion: v1
metadata:
  name: headlamp-admin
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: "headlamp-admin"
type: kubernetes.io/service-account-token
