apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: headlamp
---
# Named with an oidc-repro- prefix so it cannot collide with a ClusterRoleBinding
# a real Headlamp install owns. The harness also uses its own kubeconfig
# (scripts/common.sh), so this can only ever land on the kind cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-repro-headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
---
# Placeholder only. scripts/up.sh replaces this ConfigMap with values built
# from the kind node's InternalIP, which is not knowable until the cluster
# exists. Applying this file on its own will not produce a working stack.
apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-oidc
  namespace: headlamp
data:
  OIDC_ISSUER_URL: "replaced-by-up.sh"
  OIDC_CLIENT_ID: "replaced-by-up.sh"
  OIDC_CLIENT_SECRET: "replaced-by-up.sh"
  OIDC_SCOPES: "replaced-by-up.sh"
  OIDC_CALLBACK_URL: "replaced-by-up.sh"
---
# TWO replicas, each as its own Deployment so we can address them
# individually as hl-a and hl-b from nginx.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hl-a
  namespace: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hl-a
  template:
    metadata:
      labels:
        app: hl-a
    spec:
      serviceAccountName: headlamp
      containers:
        - name: headlamp
          # Built locally by up.sh and loaded into kind via `kind load docker-image`.
          image: headlamp:repro
          imagePullPolicy: IfNotPresent
          args:
            - "-in-cluster"
            # Without this, the context name is derived from
            # kube-system/kubeadm-config, which kind sets to "kind" -- and every
            # documented ?cluster=main URL would 404.
            - "-in-cluster-context-name=main"
            # NOT -dev. In dev mode the post-callback redirect is hardcoded to
            # http://localhost:3000/ (backend/cmd/headlamp.go), where nothing is
            # listening here, and CORS is relaxed to allow all origins. Both
            # would masquerade as the bugs this harness is meant to isolate.
            - "-oidc-client-id=$(OIDC_CLIENT_ID)"
            - "-oidc-client-secret=$(OIDC_CLIENT_SECRET)"
            - "-oidc-idp-issuer-url=$(OIDC_ISSUER_URL)"
            - "-oidc-scopes=$(OIDC_SCOPES)"
            # Pinned explicitly so the redirect URI matches what Dex has
            # registered, instead of being derived from the inbound Host header.
            - "-oidc-callback-url=$(OIDC_CALLBACK_URL)"
          envFrom:
            - configMapRef:
                name: headlamp-oidc
          ports:
            - containerPort: 4466
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hl-a
  namespace: headlamp
spec:
  selector:
    app: hl-a
  ports:
    - port: 4466
      targetPort: 4466
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hl-b
  namespace: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hl-b
  template:
    metadata:
      labels:
        app: hl-b
    spec:
      serviceAccountName: headlamp
      containers:
        - name: headlamp
          image: headlamp:repro
          imagePullPolicy: IfNotPresent
          args:
            - "-in-cluster"
            - "-in-cluster-context-name=main"
            - "-oidc-client-id=$(OIDC_CLIENT_ID)"
            - "-oidc-client-secret=$(OIDC_CLIENT_SECRET)"
            - "-oidc-idp-issuer-url=$(OIDC_ISSUER_URL)"
            - "-oidc-scopes=$(OIDC_SCOPES)"
            - "-oidc-callback-url=$(OIDC_CALLBACK_URL)"
          envFrom:
            - configMapRef:
                name: headlamp-oidc
          ports:
            - containerPort: 4466
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hl-b
  namespace: headlamp
spec:
  selector:
    app: hl-b
  ports:
    - port: 4466
      targetPort: 4466
---
# Placeholder only; scripts/up.sh replaces this with headlamp/nginx-rr.conf.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-rr
  namespace: headlamp
data:
  nginx.conf: |
    # Replaced at apply time by up.sh from headlamp/nginx-rr.conf.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-rr
  namespace: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-rr
  template:
    metadata:
      labels:
        app: nginx-rr
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          # nginx-rr.conf listens on 8080 and writes its pid/temp dirs under
          # /tmp, so the image needs neither root nor a writable /var.
          args: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: cfg
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cfg
          configMap:
            name: nginx-rr
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: headlamp
spec:
  type: NodePort
  selector:
    app: nginx-rr
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
