# nginx round-robin in front of two headlamp-server replicas.
#
# `least_conn` is intentionally NOT used — we want strict alternation so that
# /oidc and /oidc-callback are guaranteed to land on different pods. That is the
# worst case for the per-process oauthRequestMap and the deterministic way to
# reproduce #4019.
#
# Runs as non-root (uid 101), so everything nginx writes goes under /tmp.
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  upstream headlamp_pool {
    # Round-robin is the nginx default with no directive.
    # Two replicas: hl-a and hl-b. Headers added below let the repro script
    # see which replica handled each request.
    server hl-a:4466;
    server hl-b:4466;
  }

  # Only send `Connection: upgrade` when the client actually asked for one.
  # Setting it unconditionally sends a nonsensical header pair on plain HTTP
  # and disables upstream keepalive — extra variables in a harness whose whole
  # job is isolating a routing bug.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  log_format upstreamlog '$remote_addr - $upstream_addr [$time_local] '
                         '"$request" $status $upstream_response_time';

  access_log /dev/stdout upstreamlog;
  error_log  /dev/stderr warn;

  server {
    listen 8080;
    server_name _;

    location / {
      proxy_pass http://headlamp_pool;

      # $http_host, NOT $host: $host strips the port, so headlamp-server's
      # getOidcCallbackURL would derive http://<node-ip>/oidc-callback (port 80,
      # nothing listening) instead of the :30080 address the browser used.
      # The manifests also pin -oidc-callback-url, but leaving this wrong would
      # silently break any other host-derived URL.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Surface the chosen upstream so the repro script can assert alternation.
      add_header X-Upstream-Addr $upstream_addr always;

      # WebSocket upgrades for the multiplexer.
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
