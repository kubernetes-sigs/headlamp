apiVersion: v1
kind: Namespace
metadata:
  name: dex
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: dex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.39.1
          args: ["dex", "serve", "/etc/dex/cfg/config.yaml"]
          ports:
            - containerPort: 5556
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/dex/cfg
            # Dex's entrypoint expands environment variables in its config by
            # writing a temp copy into /tmp, which readOnlyRootFilesystem
            # blocks. An emptyDir keeps the read-only root and still gives it
            # somewhere to write.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: dex-config
        - name: tmp
          emptyDir: {}
---
# NodePort so that one issuer URL -- http://<node-ip>:30556/dex -- resolves
# identically from the browser on the host and from inside the headlamp pods.
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: dex
spec:
  type: NodePort
  selector:
    app: dex
  ports:
    - port: 5556
      targetPort: http
      nodePort: 30556
      name: http
