name: Release Charts

# See https://github.com/helm/chart-releaser-action

on:
  push:
    branches:
      - main
    paths:
      - charts/**
      - '!charts/**/README.md'
  # For manual dispatch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # Users verify chart signatures and provenance against this workflow on
    # main, so don't release charts from a manual run on another branch.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # need to write a commit to the repo
      packages: write # need to push chart to ghcr
      id-token: write # needed for cosign keyless signing via GitHub OIDC
      attestations: write # needed to store the provenance attestation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Prepare GPG key
        run: |
          gpg_dir=.cr-gpg
          mkdir "$gpg_dir"

          # referring keyring to private key of gpg
          keyring="$gpg_dir/secring.gpg"

          # storing base64 GPG key into keyring
          base64 -d <<< "$GPG_KEYRING_BASE64" > "$keyring"

          passphrase_file="$gpg_dir/passphrase"

          # storing passphrase data into a file
          echo "$GPG_PASSPHRASE" > "$passphrase_file"

          # saving passphrase into github-environment
          echo "CR_PASSPHRASE_FILE=$passphrase_file" >> "$GITHUB_ENV"

          # saving private key into github-environemnt
          echo "CR_KEYRING=$keyring" >> "$GITHUB_ENV"
        env:
          GPG_KEYRING_BASE64: "${{ secrets.GPG_KEYRING_BASE64 }}" #Referring secrets of github above
          GPG_PASSPHRASE: "${{ secrets.GPG_PASSPHRASE }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run chart-releaser
        id: cr
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        env:
          CR_TOKEN: "${{ github.token }}"
          CR_KEY: "${{ secrets.GPG_SIGNING_KEY_NAME }}" # Name used while creating key
          CR_SIGN: true # set to true to sign images
        with:
          config: .github/cr.yaml
          mark_as_latest: false # only headlamp is set to latest
          skip_existing: true # skip package upload if release already exists

      - name: Push Charts to GHCR
        run: |
          for pkg in .cr-release-packages/*.tgz; do
            if [ -z "${pkg:-}" ]; then
              break
            fi
            helm push "${pkg}" oci://ghcr.io/${{ github.repository }}/charts
          done

      - name: Install Cosign
        if: steps.cr.outputs.changed_charts != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # chart-releaser also reports charts whose release already existed and
      # was skipped, so only sign releases created from this commit. A re-run
      # adds any signature or provenance the previous attempt didn't. The GPG
      # .prov file is kept for `helm verify`.
      - name: Sign chart packages with cosign (keyless)
        id: sign
        if: steps.cr.outputs.changed_charts != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED_CHARTS: ${{ steps.cr.outputs.changed_charts }}
        run: |
          IFS=',' read -ra charts <<< "$CHANGED_CHARTS"
          mkdir -p .cr-release-signed .cr-release-attest
          needs_provenance=()
          for chart in "${charts[@]}"; do
            name=$(helm show chart "$chart" | awk '/^name:/ { print $2; exit }')
            version=$(helm show chart "$chart" | awk '/^version:/ { print $2; exit }')
            tag="${name}-helm-${version}"
            pkg="${name}-${version}.tgz"

            commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)
            if [ "$commit" != "$GITHUB_SHA" ]; then
              echo "Release ${tag} was created from ${commit}, not this commit, so it is left unchanged"
              continue
            fi

            assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
            has_signature=false
            has_provenance=false
            if grep -qxF "${pkg}.sigstore.json" <<< "$assets"; then
              has_signature=true
            fi
            if grep -qxF "${pkg}.intoto.jsonl" <<< "$assets"; then
              has_provenance=true
            fi
            if [ "$has_signature" = true ] && [ "$has_provenance" = true ]; then
              echo "Release ${tag} is already signed and has provenance"
              continue
            fi

            # Use the package attached to the release, which is what users download.
            gh release download "$tag" --pattern "$pkg" --dir .cr-release-signed
            if [ "$has_signature" = false ]; then
              cosign sign-blob --yes \
                --bundle ".cr-release-signed/${pkg}.sigstore.json" \
                ".cr-release-signed/${pkg}"
              gh release upload "$tag" ".cr-release-signed/${pkg}.sigstore.json"
            fi
            if [ "$has_provenance" = false ]; then
              cp ".cr-release-signed/${pkg}" .cr-release-attest/
              needs_provenance+=("${tag}=${pkg}")
            fi
          done
          echo "releases=${needs_provenance[*]}" >> "$GITHUB_OUTPUT"

      # SLSA provenance recording the workflow run that packaged the charts. It
      # is also stored in GitHub's attestation API.
      - name: Generate provenance for the chart packages
        id: attest
        if: steps.sign.outputs.releases != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .cr-release-attest/*.tgz

      - name: Upload provenance to chart releases
        if: steps.sign.outputs.releases != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          RELEASES: ${{ steps.sign.outputs.releases }}
        run: |
          for release in $RELEASES; do
            tag="${release%%=*}"
            pkg="${release#*=}"
            cp "$BUNDLE_PATH" ".cr-release-attest/${pkg}.intoto.jsonl"
            gh release upload "$tag" ".cr-release-attest/${pkg}.intoto.jsonl"
          done
