name: Nightly container build

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: headlamp-k8s/headlamp

jobs:
  push_to_registry:
    if: ${{ github.repository == 'kubernetes-sigs/headlamp' && github.ref == 'refs/heads/main' }}
    name: Build and push nightly container image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write # needed for cosign keyless signing via GitHub OIDC
    steps:
      - name: Check out the repo
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Log in to the Container registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_IMAGES }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4.2.1
        with:
          context: .
          build-args: |
            HEADLAMP_SOURCE_COMMIT=${{ github.sha }}
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check Cosign install
        run: cosign version

      - name: Sign the container image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
