name: Build App

on:
  pull_request:
    paths:
    - 'frontend/**'
    - 'Makefile'
    - '.github/**'
    - 'app/**'
    - 'backend/**'
    - 'tools/run-backend.js'
  push:
    branches:
      - main
      - rc-*
      - testing-rc-*
    paths:
    - 'frontend/**'
    - Makefile
    - '.github/**'
    - 'app/**'
    - 'backend/**'
    - 'tools/run-backend.js'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [22.x]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          app/package-lock.json
          frontend/package-lock.json
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.*'
        cache-dependency-path: |
          backend/go.sum
    - name: Run tests
      run: make app-test
    - name: Verify OAuth callback coverage
      run: npm --prefix app run test:oauth-coverage
    - name: Run tsc type checker
      run: make app-tsc
    - name: Run app-i18n-check
      run: make app-i18n-check
    - name: App linux
      run: |
        make app-linux
        make backend
    - name: Install desktop e2e dependencies
      run: |
        cd app/e2e-tests
        npm ci
        npx playwright install --with-deps chromium
    - name: Test desktop privileged bridges
      run: xvfb-run --auto-servernum npm run app:test:e2e -- tests/listenerCleanup.spec.ts tests/clusterRegistration.spec.ts
    - name: Test production frontend runtime
      run: xvfb-run --auto-servernum npm run app:test:e2e:frontend-build
    - name: Test desktop OAuth callbacks
      run: xvfb-run --auto-servernum npm run app:test:e2e -- tests/oauthProvider.spec.ts tests/protocolScheme.spec.ts
    - name: Test external backend token
      run: xvfb-run --auto-servernum npm run app:test:e2e -- tests/externalBackendToken.spec.ts
    - name: Verify Linux build
      run: npm run app:verify-build-linux
    - name: Start Minikube
      uses: medyagh/setup-minikube@e9e035a86bbc3caea26a450bd4dbf9d0c453682e # latest
    - name: Verify Minikube
      run: |
        minikube status
        kubectl config use-context minikube
        kubectl get nodes
    - name: Run app e2e tests
      env:
        HEADLAMP_APP_E2E_CONTEXT: minikube
      run: |
        make backend
        npm --prefix app/e2e-tests ci
        npm --prefix app/e2e-tests exec -- playwright install --with-deps chromium
          xvfb-run npm run app:test:e2e -- backendToken.spec.ts
  build-windows:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            node-version: 22.x
          - arch: arm64
            runner: windows-11-arm
            node-version: 22.x
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          app/package-lock.json
          frontend/package-lock.json
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.*'
        cache-dependency-path: |
          backend/go.sum
    - name: Dependencies
      uses: crazy-max/ghaction-chocolatey@dfdcf5bba9c0a16358a21c13a06ec5c89024b3ac # v4.1.0
      with:
        args: install make
    - name: Run tests
      run: make app-test
    - name: Run tsc type checker
      run: make app-tsc
    - name: App Windows ${{ matrix.arch }}
      run: make app-win-${{ matrix.arch }}
    - name: Install desktop e2e dependencies
      run: npm --prefix app/e2e-tests ci
    - name: Test external backend token
      run: npm run app:test:e2e -- tests/externalBackendToken.spec.ts
    - name: Test desktop cluster registration
      if: matrix.arch == 'x64'
      run: npm run app:test:e2e -- tests/clusterRegistration.spec.ts
    - name: Verify Windows build
      shell: pwsh
      run: npm run app:verify-build-windows
  build-mac:
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          app/package-lock.json
          frontend/package-lock.json
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.*'
        cache-dependency-path: |
          backend/go.sum
    - name: Dependencies
      run: brew install make
    - name: Run tests
      run: make app-test
    - name: Run tsc type checker
      run: make app-tsc
    - name: App Mac
      run: |
        make app-mac
    - name: Verify Mac build
      run: npm run app:verify-build-mac
