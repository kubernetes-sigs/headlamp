name: Upload Release Assets

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'The release version to upload to (e.g. 0.9.0)'
        required: true
      run_ids:
        description: 'Comma-separated run IDs of workflows with artifacts to download'
        required: false
      force:
        description: 'Force upload even if the release is no longer a draft'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write # need to write to releases and download artifacts
      id-token: write # needed for cosign keyless signing via GitHub OIDC
    steps:
      # Users verify the checksums signature against this workflow on main, so
      # a signature made from any other branch would fail verification.
      - name: Check that the workflow runs from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from the main branch, not ${GITHUB_REF}."
          exit 1

      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '22'

      - name: Create artifacts directory
        run: mkdir -p ./artifacts

      - name: Download artifacts from workflow runs
        if: ${{ inputs.run_ids != '' }}
        run: |
          mkdir -p ./artifacts

          # Split the run_ids input by comma and process each run ID
          IFS=',' read -ra RUN_IDS <<< "${{ inputs.run_ids }}"

          for run_id in "${RUN_IDS[@]}"; do
            run_id=$(echo $run_id | xargs)  # Trim whitespace
            if [ -n "$run_id" ]; then
              echo "Downloading artifacts from run ID: $run_id"

              # Create a subdirectory for this run
              mkdir -p "./artifacts/run-$run_id"

              # Download artifacts for this run ID
              # Note: This action will automatically download all artifacts from the run
              gh run download $run_id --dir "./artifacts/run-$run_id"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          find ./artifacts -type f -not -path "*/\.*" | sort

      # Flatten directory structure for easier upload
      - name: Prepare artifacts for upload
        run: |
          mkdir -p ./flattened-artifacts
          find ./artifacts -type f -not -path "*/\.*" -exec cp {} ./flattened-artifacts/ \;

          # Remove blockmap files if they exist
          find ./flattened-artifacts -type f -name "*.blockmap" -exec rm {} \;

          echo "Files prepared for upload:"
          ls -la ./flattened-artifacts/

          # Exit if no files are found
          if [ -z "$(ls -A ./flattened-artifacts)" ]; then
            echo "No artifacts found to upload!"
            exit 0
          fi

      - name: Install script dependencies
        working-directory: ./app/scripts/push-release-assets
        run: npm ci

      - name: Upload assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_UPDATE_TOKEN }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" == "true" ]; then
            FORCE_FLAG="--force"
          fi

          ARTIFACTS_PATH="$(pwd)/flattened-artifacts"
          ASSETS=($(ls -1 $ARTIFACTS_PATH))

          # Create the command with all artifact paths
          cd ./app/scripts/push-release-assets/
          CMD="node push-release-assets.js $FORCE_FLAG ${{ inputs.release_name }}"

          for asset in "${ASSETS[@]}"; do
            CMD+=" $ARTIFACTS_PATH/$asset"
          done

          echo "Executing: $CMD"
          eval $CMD

      # The release is still a draft at this point and is not attached to its
      # vX.Y.Z tag yet, so `gh release download/upload <name>` cannot find it.
      # Look it up by name instead, like push-release-assets.js does.
      - name: Download checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_UPDATE_TOKEN }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          # Wait a moment for the checksums.txt to be available
          sleep 5

          mkdir -p ./temp-checksums

          release_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.name == env.RELEASE_NAME) | .id' | head -n 1)
          if [ -z "$release_id" ]; then
            echo "Release ${RELEASE_NAME} not found"
            exit 1
          fi

          asset_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
            --jq '.[] | select(.name == "checksums.txt") | .id' | head -n 1)
          if [ -z "$asset_id" ]; then
            echo "checksums.txt not found in release ${RELEASE_NAME}"
            exit 1
          fi

          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > ./temp-checksums/checksums.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check Cosign install
        run: cosign version

      - name: Sign checksums.txt with cosign (keyless)
        run: |
          cosign sign-blob --yes \
            --bundle ./temp-checksums/checksums.txt.sigstore.json \
            ./temp-checksums/checksums.txt

      - name: Upload signature to release
        working-directory: ./app/scripts/push-release-assets
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_UPDATE_TOKEN }}
          RELEASE_NAME: ${{ inputs.release_name }}
          FORCE: ${{ inputs.force }}
        run: |
          FORCE_FLAG=""
          if [ "$FORCE" == "true" ]; then
            FORCE_FLAG="--force"
          fi

          # --skip-checksums so the signature is not added to checksums.txt,
          # which would invalidate it.
          node push-release-assets.js $FORCE_FLAG --skip-checksums "$RELEASE_NAME" \
            ../../../temp-checksums/checksums.txt.sigstore.json

      - name: Install releaser
        working-directory: ./tools/releaser
        run: npm ci && npm run build

      # push-release-assets.js logs upload errors but still exits successfully,
      # so check that the signature was actually attached.
      - name: Verify signature was attached
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_UPDATE_TOKEN }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          node ./tools/releaser/dist/index.js ci verify-assets "$RELEASE_NAME" \
            ./temp-checksums/checksums.txt.sigstore.json
