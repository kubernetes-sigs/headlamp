name: Test image digest tooling

on:
  pull_request:
    paths:
      - 'tools/verify-image-digests*'
      - '.github/workflows/image-digests.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/verify-image-digests*'
      - '.github/workflows/image-digests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --test tools/verify-image-digests.test.js
