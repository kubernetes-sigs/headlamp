name: Go WASM compatibility

on:
  pull_request:
    paths:
      - 'frontend/vite.config.ts'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'e2e-tests/test-wasm-compatibility.cjs'
      - 'e2e-tests/package.json'
      - 'e2e-tests/package-lock.json'
      - 'backend/go.mod'
      - '.github/workflows/wasm-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e-tests/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: npm --prefix frontend ci
      - run: npm --prefix e2e-tests ci
      - name: Install the test browser
        working-directory: e2e-tests
        run: npx playwright install --with-deps chromium
      - name: Check Go WASM and Node API compatibility
        run: npm --prefix e2e-tests run test:wasm
