name: Lint and Test Charts

on:
  pull_request:
    paths:
      - charts/**
      - '!charts/**/README.md'
  push:
    branches:
      - main
      - rc-*
      - testing-rc-*
    
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.7

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config .github/ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        run: ct lint --config .github/ct.yaml

      - name: Setup Minikube
        uses: medyagh/setup-minikube@e9e035a86bbc3caea26a450bd4dbf9d0c453682e # latest
        with:
          container-runtime: docker

      - name: Build image & Run chart-testing (install)
        run: |
          export SHELL=/bin/bash
          eval $(minikube -p minikube docker-env)
          DOCKER_IMAGE_VERSION=ci-test make image
          echo -n "verifying images:"
          docker images
          ct install --config .github/ct.yaml --helm-extra-set-args="--set=image.tag=ci-test --set image.pullPolicy=Never"

