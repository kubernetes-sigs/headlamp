name: Build and upload Linux app artifact

on:
  workflow_dispatch:
    inputs:
      buildBranch:
        description: 'Headlamp ref/branch/tag'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to upload artifacts
      contents: write
      id-token: write # needed to sign the provenance via GitHub OIDC
      attestations: write # needed to store the provenance attestation
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.inputs.buildBranch }}
    - name: Setup nodejs
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22.x
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.*'
    - name: App linux
      run: |
        make app-linux
    - name: Rename AppImage 64bit version
      run: |
        FILE_PATH=$(echo app/dist/Headlamp*x86_64*.AppImage); mv ${FILE_PATH} $(echo ${FILE_PATH}|sed s/x86_64/x64/)
    # Provenance records the workflow's commit as the source, so it is only
    # generated when that commit was built, as with `releaser ci app`.
    - name: Check that the workflow ref was built
      id: source
      run: |
        built=$(git rev-parse HEAD)
        if [ "$built" = "$GITHUB_SHA" ]; then
          echo "matches=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Built ${built}, but the workflow ran from ${GITHUB_SHA}, so no provenance is generated. Run the workflow from the ref it builds for release builds."
        fi
    - name: Generate provenance
      id: attest
      if: steps.source.outputs.matches == 'true'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          app/dist/Headlamp*.tar.*
          app/dist/Headlamp*.AppImage
          app/dist/headlamp*.deb
    - name: Prepare provenance artifact
      if: steps.source.outputs.matches == 'true'
      env:
        BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
      run: |
        mkdir -p provenance
        cp "$BUNDLE_PATH" provenance/headlamp-linux.intoto.jsonl
    - name: Upload provenance artifact
      if: steps.source.outputs.matches == 'true'
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
      with:
        name: Provenance-linux
        path: ./provenance/headlamp-linux.intoto.jsonl
        if-no-files-found: error
        retention-days: 1
    - name: Upload Tarball artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: Tarballs
        path: ./app/dist/Headlamp*.tar.*
        if-no-files-found: error
        retention-days: 1
    - name: Upload AppImage artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: AppImages
        path: ./app/dist/Headlamp*.AppImage
        if-no-files-found: error
        retention-days: 1
    - name: Upload Debian artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: Debian
        path: ./app/dist/headlamp*.deb
        if-no-files-found: error
        retention-days: 1
