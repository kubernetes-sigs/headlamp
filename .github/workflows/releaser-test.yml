name: Releaser test

on:
  pull_request:
    paths:
      - 'tools/releaser/**'
      - '.github/workflows/releaser-test.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/releaser/**'
      - '.github/workflows/releaser-test.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test releaser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/releaser
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
