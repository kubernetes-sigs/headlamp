name: Releaser test

on:
  pull_request:
    paths:
      - 'tools/releaser/**'
      - '.github/workflows/releaser-test.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/releaser/**'
      - '.github/workflows/releaser-test.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test releaser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/releaser
    steps:
      - name: Check out the repo
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
